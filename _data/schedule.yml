      - time: "14:15"
        title: "Adaptive Adversaries: How researchers are learning to outsmart cancer"
        speaker_id: speaker-e
        description: "In this session, Meghan will demystify clinical trials and explain what participation really means, so that if attendees or their loved ones are ever offered a trial, the experience feels informed rather than intimidating. She will explore how advances in genetic and epigenetic science are transforming cancer care, allowing researchers to understand not just where a cancer has developed, but the unique biological code and signals driving it. Meghan will discuss how modern cancer therapies increasingly resemble sophisticated defence systems, from CAR-T cells that are genetically engineered and redeployed like a bespoke threat-response team, to AI-enabled radiation therapy that helps identify patterns and optimise treatment decisions. Just as cybersecurity professionals work to understand evolving threats, vulnerabilities, and defence strategies in the digital world, cancer researchers are learning to decode, monitor, and outsmart an adaptive biological adversary. Clinical trials are where the next generation of these defences is tested, refined, and ultimately brought into clinical practice."
        tag: health


      - time: "15:00"
