        title: "Tabletop Exercise: What If It Were Cancer? A Crisis Simulation on Time-Critical Decision Making"
        speaker_id: speaker-f
        description: " Healthcare crises should be treated with the same urgency, coordination, and structured response as a cyber incident, where delays have real consequences."
        tag: health


