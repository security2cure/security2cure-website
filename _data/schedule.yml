        speaker_id: speaker-a
        description: "This session explores the trajectory of cognitive development across the adult lifespan, examining when different cognitive abilities reach their peak and how memory changes through the normal ageing process.  It also highlights practical, evidence-based strategies to strengthen memory, maintain cognitive health, and remain mentally active and engaged in an increasingly AI-driven world. "
