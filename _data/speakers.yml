- id: speaker-a
  name: "Dr Donna Spooner"
  role: "Clinical Neuropsychologist, Your Brain In Mind"
  bio: "Donna is a psychologist with 25 years experience in the neuropsychological assessment of patients presenting with a range of neurological conditions, including dementia, traumatic brain injury, epilepsy, brain tumours, stroke, and movement disorders.  She obtained her PhD in Clinical Neuropsychology & Clinical Psychology from the University of Queensland in 2007, with her research focused on memory functioning in the perimenopausal period and the effects of hormone replacement.  The first 15 years of her clinical career were based within the Neurology and Neurosurgery Departments of the Royal Brisbane & Women’s Hospital, before she moved solely to the private sector.  She never ceases to be fascinated with the cognitive symptoms that patients present with in the context of their neurological conditions, or the resilience that individuals can show in the face of adverse health prognoses.  Donna now combines her neuropsychology experience with her clinical psychology background, providing assessments, cognitive remediation interventions, and therapy to patients seeking to improve their cognitive functioning and psychological well-being."
