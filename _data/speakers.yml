- id: speaker-a
  name: "Dr Donna Spooner"
  role: "Clinical Neuropsychologist, Your Brain In Mind"
  bio: "Donna is a Clinical Neuropsychologist with a strong interest in the assessment of dementia and other neurological conditions, as well as the design of interventions to assist.  As part of her detailed assessment of individuals’ cognitive or “thinking” skills, she adopts a strengths-based approach to strategy development, capitalising on areas where the person remains to be functioning well. She completed her PhD in Clinical Neuropsychology and Clinical Psychology at the University of Queensland in 2007 and has more than 20 years’ experience in the field of Clinical Neuropsychology.  She was previously employed at the Royal Brisbane & Women’s Hospital for 15 years, providing neuropsychological services to the Memory Clinic and Neurology Department.  She has also worked across a range of private and other public health settings, including the both the Neurosciences Department and the Cognitive, Dementia and Memory Service at St Vincent’s Hospital, Melbourne. Donna is a registered psychologist with AHPRA and holds endorsements in Clinical Neuropsychology and Clinical Psychology.  She is also a member of the APS Psychology and Ageing Interest Group and the Young Onset Dementia Special Interest Group.  She holds the position of Adjunct Lecturer at the University of Queensland and has been involved for many years in the training of postgraduate Neuropsychology students. As a result of her experience, Donna has an in-depth knowledge of the cognitive presentation of a wide range of dementias and neurological conditions.  She is highly committed to the delivery of evidence-based practice and is known for her calm and approachable manner. "
