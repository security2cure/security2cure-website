- id: speaker-c
  name: "Kyle Jackson"
  role: "Head of AI and Automation, Sekuro"
  bio: "As Head of AI and Automation at Sekuro, I lead the design and delivery of AI-powered platforms and tools at the intersection of artificial intelligence and cyber security. I believe AI must be built with security and privacy as foundational principles, not as afterthoughts, and I champion that conviction across everything my team delivers. With nearly two decades of experience spanning infrastructure engineering, cloud architecture, security operations, and executive leadership, I bring a rare combination of deep technical capability and strategic vision. My background across senior security leadership roles, including Director of Information Security, Senior Manager of Cyber Security, and Cyber Security Strategy and Architecture consulting, directly shapes how I approach AI risk, responsible use, and secure-by-design engineering. I remain a hands-on technical leader, contributing to system design, architecture, and code whilst simultaneously building and growing a high-performing engineering team.""
